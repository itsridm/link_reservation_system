<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>『LINK』体験予約 - 運営者画面</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h1 { font-size: 20px; color: #333; text-align: center; margin-bottom: 20px; }
    
    /* 案内中バナー＆ボタン */
    .current-banner { background: #06c755; color: white; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(6,199,85,0.3); }
    .current-time { font-size: 26px; font-weight: bold; margin: 10px 0; }
    .btn-next { background: #fff; color: #06c755; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; transition: background 0.2s; }
    .btn-next:hover { background: #f0f0f0; }
    .btn-next:disabled { background: #e0e0e0; color: #888; cursor: not-allowed; }

    /* 予約一覧テーブル */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e0e0e0; font-size: 14px; }
    th { background: #f8f9fa; color: #333; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>『LINK』体験 運営者画面</h1>
    
    <!-- 現在案内中の枠 ＆ 次の枠へ進むボタン -->
    <div id="currentBanner" class="current-banner" style="display: none;">
      <div>現在案内中の枠</div>
      <div id="currentTargetTime" class="current-time">-</div>
      <button id="nextSlotBtn" class="btn-next">次の枠へ進む</button>
    </div>

    <!-- 案内中枠の予約者一覧 -->
    <div class="card">
      <div style="font-weight: bold; margin-bottom: 12px; color: #555;" id="targetSlotTitle">案内中枠の予約者一覧</div>
      <table>
        <thead>
          <tr>
            <th>LINE表示名</th>
            <th>予約ID</th>
            <th>人数</th>
            <th>受付状況</th>
          </tr>
        </thead>
        <tbody id="managerReservationTable">
          <tr><td colspan="4" style="text-align: center; color: #777;">現在案内中の枠はありません</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const socket = io();
    let globalSlots = [];
    let globalReservations = [];
    let currentSlotIndex = 0;

    socket.on('slots-updated', (data) => {
      globalSlots = data.slots;
      globalReservations = data.reservations;
      currentSlotIndex = data.currentSlotIndex;
      updateManager();
    });

    fetch('/api/data')
      .then(res => res.json())
      .then(data => {
        globalSlots = data.slots;
        globalReservations = data.reservations;
        currentSlotIndex = data.currentSlotIndex;
        updateManager();
      });

    function updateManager() {
      const currentBanner = document.getElementById('currentBanner');
      const currentTargetTime = document.getElementById('currentTargetTime');
      const tbody = document.getElementById('managerReservationTable');
      const nextSlotBtn = document.getElementById('nextSlotBtn');

      if (globalSlots.length === 0 || currentSlotIndex >= globalSlots.length) {
        currentBanner.style.display = 'none';
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #777;">現在有効な枠はありません</td></tr>';
        return;
      }

      currentBanner.style.display = 'block';
      const currentSlot = globalSlots[currentSlotIndex];
      currentTargetTime.innerText = currentSlot.time;

      // 「次の枠へ」ボタンの有効・無効切り替え
      if (currentSlotIndex >= globalSlots.length - 1) {
        nextSlotBtn.innerText = "最後の枠です";
        nextSlotBtn.disabled = true;
      } else {
        nextSlotBtn.innerText = "次の枠へ進む";
        nextSlotBtn.disabled = false;
      }

      // 現在の枠に紐づく予約を抽出
      const targetReservations = globalReservations.filter(r => r.slotId === currentSlot.id);
      
      tbody.innerHTML = '';
      if (targetReservations.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #777;">この枠の予約はありません</td></tr>';
      } else {
        targetReservations.forEach(resv => {
          const statusHtml = resv.checked 
            ? '<span style="color: #06c755; font-weight: bold;">受付済</span>' 
            : '<span style="color: #666;">未受付</span>';

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${resv.displayName || 'ゲスト'}</td>
            <td>${resv.id}</td>
            <td>${resv.count || 1}名</td>
            <td>${statusHtml}</td>
          `;
          tbody.appendChild(tr);
        });
      }
    }

    // 次の枠へ進むボタン
    document.getElementById('nextSlotBtn').onclick = async () => {
      try {
        const res = await fetch('/api/admin/next-slot', { method: 'POST' });
        const data = await res.json();
        if (!data.success) {
          alert("次の枠に進めませんでした");
        }
      } catch (err) {
        alert("通信エラーが発生しました");
      }
    };
  </script>
</body>
</html>
