<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理者ログイン</title>
  <style>
    body { font-family: sans-serif; padding: 40px 20px; text-align: center; background: #f0f2f5; }
    .box { background: white; padding: 30px; max-width: 350px; margin: auto; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    input { width: 80%; padding: 12px; font-size: 1.2rem; text-align: center; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 6px; }
    button { background: #333; color: white; padding: 10px 20px; font-size: 1rem; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <h2>管理者ログイン</h2>
    <input type="password" id="pin" placeholder="PINを入力">
    <br>
    <button onclick="login()">ログイン</button>
  </div>

  <script>
    async function login() {
      const pin = document.getElementById('pin').value;
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin })
      });
      const data = await res.json();
      if (data.success) {
        sessionStorage.setItem('adminAuth', 'true');
        location.href = '/admin';
      } else {
        alert(data.error);
      }
    }
  </script>
</body>
</html>
