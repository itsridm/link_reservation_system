<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>『LINK』受付スキャナー</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { font-family: sans-serif; background: #f4f6f8; margin: 0; padding: 15px; }
    .container { max-width: 500px; margin: 0 auto; }
    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
    h1 { font-size: 18px; color: #333; text-align: center; margin-bottom: 15px; }
    
    #reader { width: 100%; border-radius: 8px; overflow: hidden; }
    
    .result-box { margin-top: 15px; padding: 15px; border-radius: 8px; font-size: 16px; text-align: center; font-weight: bold; }
    .success { background: #eef9f2; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    
    .back-link { display: block; text-align: center; margin-top: 15px; color: #007bff; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>来場者QRコード受付</h1>
      <div id="reader"></div>
      <div id="scanResult" class="result-box" style="display: none;"></div>
    </div>
    <a href="/admin" class="back-link">管理者ダッシュボードに戻る</a>
  </div>

  <script>
    let isProcessing = false;

    async function onScanSuccess(decodedText, decodedResult) {
      if (isProcessing) return;
      isProcessing = true;

      const reservationId = decodedText.trim();
      const resultBox = document.getElementById('scanResult');

      try {
        const res = await fetch('/api/admin/check-in', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reservationId })
        });
        const data = await res.json();

        resultBox.style.display = 'block';
        if (data.success) {
          resultBox.className = 'result-box success';
          resultBox.innerHTML = `✓ 受付完了<br><span style="font-size: 14px; font-weight: normal;">${data.reservation.displayName} (${data.reservation.count}名)</span>`;
        } else {
          resultBox.className = 'result-box error';
          resultBox.innerText = "エラー: " + data.error;
        }
      } catch (err) {
        resultBox.style.display = 'block';
        resultBox.className = 'result-box error';
        resultBox.innerText = "通信エラーが発生しました";
      }

      // 3秒後に次の読み取りを再開
      setTimeout(() => {
        isProcessing = false;
        resultBox.style.display = 'none';
      }, 3000);
    }

    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      onScanSuccess
    ).catch(err => {
      console.error("カメラ起動失敗:", err);
      alert("カメラの起動に失敗しました。カメラの権限を確認してください。");
    });
  </script>
</body>
</html>
