<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>『LINK』体験予約 - 運営者画面（iPad対応）</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #f4f6f8; margin: 0; padding: 15px; height: 100vh; overflow: hidden; }
    
    /* iPadの画面全体に合わせたレイアウト */
    .ipad-container {
      display: flex;
      gap: 15px;
      width: 100%;
      height: calc(100vh - 30px);
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 左側：時間枠一覧 */
    .left-pane {
      width: 350px;
      background: #fff;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .pane-title { font-size: 16px; font-weight: bold; color: #333; margin-bottom: 12px; border-bottom: 2px solid #06c755; padding-bottom: 6px; }
    .slot-scroll-area { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
    
    .slot-card {
      padding: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      cursor: pointer;
      background: #fff;
      transition: all 0.2s;
    }
    .slot-card:hover { background: #f9f9f9; }
    .slot-card.selected { border-color: #06c755; background: #eef9f2; box-shadow: 0 2px 5px rgba(6,199,85,0.2); }
    .slot-card.current-active { border-color: #ff9800; background: #fff8e1; }
    .slot-card-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 15px; color: #333; margin-bottom: 4px; }
    .slot-card-sub { font-size: 13px; color: #666; display: flex; justify-content: space-between; }

    /* 右側：選択中の枠の予約者詳細 ＆ アクション */
    .right-pane {
      flex: 1;
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }
    
    /* 右上アクションバー */
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8f9fa;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      border: 1px solid #e9ecef;
    }
    .selected-slot-label { font-size: 18px; font-weight: bold; color: #333; }
    .btn-group { display: flex; gap: 10px; }
    
    .btn { padding: 10px 18px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; color: white; transition: background 0.2s; }
    .btn-next { background: #06c755; }
    .btn-next:hover { background: #05b34c; }
    .btn-call { background: #17a2b8; }
    .btn-call:hover { background: #138496; }
    .btn:disabled { background: #cccccc; cursor: not-allowed; }

    /* 右下：予約者一覧テーブル */
    .table-scroll-area { flex: 1; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e0e0e0; font-size: 14px; }
    th { background: #f8f9fa; color: #333; font-weight: bold; position: sticky; top: 0; z-index: 1; }

    /* 受付完了ポップアップ */
    #popupOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6); display: flex; justify-content: center; align-items: center;
      z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    }
    #popupOverlay.show { opacity: 1; pointer-events: auto; }
    .popup-card { background: #fff; width: 85%; max-width: 380px; padding: 25px 20px; border-radius: 16px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
    .popup-title { font-size: 22px; color: #06c755; font-weight: bold; margin-bottom: 12px; }
    .popup-detail { font-size: 16px; color: #333; line-height: 1.6; text-align: left; background: #f8f9fa; padding: 12px 15px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="ipad-container">
    <!-- 左側：時間枠一覧 -->
    <div class="left-pane">
      <div class="pane-title">予約時間枠一覧</div>
      <div id="slotScrollArea" class="slot-scroll-area">
        <div style="color: #777; text-align: center; padding: 20px;">読み込み中...</div>
      </div>
    </div>

    <!-- 右側：選択中の枠の予約者詳細 ＆ 操作ボタン -->
    <div class="right-pane">
      <div class="action-bar">
        <div>
          <div style="font-size: 12px; color: #666; margin-bottom: 2px;">選択中の枠</div>
          <div id="selectedSlotTitle" class="selected-slot-label">時間枠を選択してください</div>
        </div>
        <div class="btn-group">
          <button id="callBtn" class="btn btn-call" disabled>LINE呼び出し</button>
          <button id="nextSlotBtn" class="btn btn-next">次の枠へ進行</button>
        </div>
      </div>

      <div class="pane-title" style="border-bottom-color: #007bff;">予約者一覧</div>
      <div class="table-scroll-area">
        <table>
          <thead>
            <tr>
              <th>LINE表示名</th>
              <th>予約ID</th>
              <th>人数</th>
              <th>受付状況</th>
            </tr>
          Ref:
            <tbody id="managerReservationTable">
              <tr><td colspan="4" style="text-align: center; color: #777;">左側の時間枠を選択してください</td></tr>
            </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 受付完了ポップアップ -->
  <div id="popupOverlay">
    <div class="popup-card">
      <div class="popup-title">受付完了！</div>
      <div class="popup-detail" id="popupContent"></div>
    </div>
  </div>

  <script>
    const socket = io();
    let globalSlots = [];
    let globalReservations = [];
    let currentSlotIndex = 0;
    let selectedSlotId = null; // 現在選択している枠のID

    socket.on('slots-updated', (data) => {
      // 受付済みに変わった瞬間を検知してポップアップ表示
      data.reservations.forEach(newRes => {
        const oldRes = globalReservations.find(r => r.id === newRes.id);
        if (newRes.checked && (!oldRes || !oldRes.checked)) {
          showPopup(newRes);
        }
      });

      globalSlots = data.slots;
      globalReservations = data.reservations;
      currentSlotIndex = data.currentSlotIndex;
      
      // デフォルト選択の維持または自動選択
      if (!selectedSlotId && globalSlots.length > 0) {
        selectedSlotId = globalSlots[currentSlotIndex] ? globalSlots[currentSlotIndex].id : globalSlots[0].id;
      }
      renderManager();
    });

    fetch('/api/data')
      .then(res => res.json())
      .then(data => {
        globalSlots = data.slots;
        globalReservations = data.reservations;
        currentSlotIndex = data.currentSlotIndex;
        if (globalSlots.length > 0) {
          selectedSlotId = globalSlots[currentSlotIndex] ? globalSlots[currentSlotIndex].id : globalSlots[0].id;
        }
        renderManager();
      });

    function showPopup(reservation) {
      const overlay = document.getElementById('popupOverlay');
      const content = document.getElementById('popupContent');
      content.innerHTML = `
        <div><strong>LINE表示名:</strong> ${reservation.displayName || 'ゲスト'}</div>
        <div><strong>人数:</strong> ${reservation.count || 1}名</div>
        <div><strong>予約ID:</strong> ${reservation.id}</div>
      `;
      overlay.classList.add('show');
      setTimeout(() => overlay.classList.remove('show'), 3000);
    }

    function renderManager() {
      const slotScrollArea = document.getElementById('slotScrollArea');
      const selectedSlotTitle = document.getElementById('selectedSlotTitle');
      const tbody = document.getElementById('managerReservationTable');
      const nextSlotBtn = document.getElementById('nextSlotBtn');
      const callBtn = document.getElementById('callBtn');

      slotScrollArea.innerHTML = '';

      if (globalSlots.length === 0) {
        slotScrollArea.innerHTML = '<div style="color: #777; text-align: center; padding: 20px;">登録枠がありません</div>';
        selectedSlotTitle.innerText = "枠がありません";
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #777;">予約データがありません</td></tr>';
        return;
      }

      // 次の枠ボタンの制御
      if (currentSlotIndex >= globalSlots.length - 1) {
        nextSlotBtn.innerText = "最終枠";
      } else {
        nextSlotBtn.innerText = "次の枠へ進行";
      }

      // 左側の時間枠一覧を描画
      globalSlots.forEach((slot, index) => {
        const div = document.createElement('div');
        div.className = 'slot-card';
        if (slot.id === selectedSlotId) div.classList.add('selected');
        if (index === currentSlotIndex) div.classList.add('current-active');

        div.onclick = () => {
          selectedSlotId = slot.id;
          renderManager();
        };

        div.innerHTML = `
          <div class="slot-card-header">
            <span>${slot.time}</span>
            <span style="font-size: 13px; color: ${index === currentSlotIndex ? '#d35400' : '#555'};">
              ${index === currentSlotIndex ? '★案内中' : ''}
            </span>
          </div>
          <div class="slot-card-sub">
            <span>予約人数: ${slot.booked} / ${slot.capacity}名</span>
          </div>
        `;
        slotScrollArea.appendChild(div);
      });

      // 選択中の枠のデータを取得
      const targetSlot = globalSlots.find(s => s.id === selectedSlotId) || globalSlots[currentSlotIndex];
      if (targetSlot) {
        selectedSlotTitle.innerText = targetSlot.time + (targetSlot.id === globalSlots[currentSlotIndex]?.id ? ' (案内中)' : '');
        callBtn.disabled = false;

        const targetReservations = globalReservations.filter(r => r.slotId === targetSlot.id);
        tbody.innerHTML = '';
        if (targetReservations.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #777;">この時間枠の予約はありません</td></tr>';
        } else {
          targetReservations.forEach(resv => {
            const statusHtml = resv.checked 
              ? '<span style="color: #06c755; font-weight: bold;">受付済</span>' 
              : '<span style="color: #666;">未受付</span>';

            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${resv.displayName || 'ゲスト'}</td>
              <td>${resv.id}</td>
              <td>${resv.count || 1}名</td>
              <td>${statusHtml}</td>
            `;
            tbody.appendChild(tr);
          });
        }
      }
    }

    // 「次の枠へ進行」ボタン（前の枠を完全削除・非表示にする）
    document.getElementById('nextSlotBtn').onclick = async () => {
      try {
        const res = await fetch('/api/admin/next-slot', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          // 進んだ後の新しい現在進行中の枠を自動選択
          if (globalSlots[data.currentSlotIndex]) {
            selectedSlotId = globalSlots[data.currentSlotIndex].id;
          }
        } else {
          alert(data.error || "これ以上先の枠はありません");
        }
      } catch (err) {
        alert("通信エラーが発生しました");
      }
    };

    // 「LINE呼び出し」ボタン
    document.getElementById('callBtn').onclick = async () => {
      if (!selectedSlotId) return;
      if (!confirm("選択中の時間枠の予約者全員にLINEリマインドを送信しますか？")) return;

      try {
        const res = await fetch('/api/admin/call-slot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slotId: selectedSlotId })
        });
        const data = await res.json();
        if (data.success) {
          alert(`呼び出しメッセージを送信しました（送信数: ${data.sentCount}名）`);
        } else {
          alert("送信エラー: " + data.error);
        }
      } catch (err) {
        alert("通信エラーが発生しました");
      }
    };
  </script>
</body>
</html>
