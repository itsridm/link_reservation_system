<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>『LINK』受付スキャナー</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { font-family: sans-serif; background: #f4f6f8; margin: 0; padding: 15px; }
    .container { max-width: 500px; margin: 0 auto; }
    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
    h1 { font-size: 18px; color: #333; text-align: center; margin-bottom: 15px; }
    
    .scanner-wrapper { position: relative; width: 100%; border-radius: 8px; overflow: hidden; }
    #reader { width: 100%; }
    
    .overlay-success, .overlay-error {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 10;
      display: none;
      animation: fadeIn 0.2s ease;
      padding: 20px;
      box-sizing: border-box;
    }
    .overlay-success { background: rgba(6, 199, 85, 0.95); }
    .overlay-error { background: rgba(220, 53, 69, 0.95); }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .check-icon { font-size: 64px; font-weight: bold; margin-bottom: 10px; line-height: 1; }
    .success-text { font-size: 22px; font-weight: bold; margin-bottom: 5px; }
    .success-sub { font-size: 16px; opacity: 0.9; }

    .back-link { display: block; text-align: center; margin-top: 15px; color: #007bff; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>来場者QRコード受付</h1>
      
      <div class="scanner-wrapper">
        <div id="reader"></div>
        
        <div id="overlaySuccess" class="overlay-success">
          <div class="check-icon">✓</div>
          <div class="success-text">受付完了</div>
          <div class="success-sub" id="successDetail">-</div>
        </div>

        <div id="overlayError" class="overlay-error">
          <div style="font-size: 40px; margin-bottom: 10px;">⚠️</div>
          <div id="errorText" style="font-size: 18px; font-weight: bold;">エラー</div>
        </div>
      </div>

    </div>
    <a href="/admin" class="back-link">管理者ダッシュボードに戻る</a>
  </div>

  <script>
    const socket = io();
    let isProcessing = false;
    let globalSlots = [];
    let globalReservations = [];
    let currentSlotIndex = 0;

    socket.on('slots-updated', (data) => {
      globalSlots = data.slots;
      globalReservations = data.reservations;
      currentSlotIndex = data.currentSlotIndex;
    });

    fetch('/api/data')
      .then(res => res.json())
      .then(data => {
        globalSlots = data.slots;
        globalReservations = data.reservations;
        currentSlotIndex = data.currentSlotIndex;
      });

    async function onScanSuccess(decodedText, decodedResult) {
      if (isProcessing) return;
      isProcessing = true;

      const reservationId = parseInt(decodedText.trim());
      const overlaySuccess = document.getElementById('overlaySuccess');
      const overlayError = document.getElementById('overlayError');
      const successDetail = document.getElementById('successDetail');
      const errorText = document.getElementById('errorText');

      const targetReservation = globalReservations.find(r => r.id === reservationId);
      if (!targetReservation) {
        errorText.innerText = "該当する予約が見つかりません";
        overlayError.style.display = 'flex';
        setTimeout(resetScanner, 3000);
        return;
      }

      const currentSlot = globalSlots[currentSlotIndex];
      if (!currentSlot || targetReservation.slotId !== currentSlot.id) {
        errorText.innerText = "受付枠外です（現在の案内枠の予約ではありません）";
        overlayError.style.display = 'flex';
        setTimeout(resetScanner, 3000);
        return;
      }

      try {
        const res = await fetch('/api/admin/check-in', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reservationId })
        });
        const data = await res.json();

        if (data.success) {
          successDetail.innerText = `${data.reservation.displayName} (${data.reservation.count}名)`;
          overlaySuccess.style.display = 'flex';
        } else {
          errorText.innerText = data.error;
          overlayError.style.display = 'flex';
        }
      } catch (err) {
        errorText.innerText = "通信エラーが発生しました";
        overlayError.style.display = 'flex';
      }

      setTimeout(resetScanner, 3000);
    }

    function resetScanner() {
      document.getElementById('overlaySuccess').style.display = 'none';
      document.getElementById('overlayError').style.display = 'none';
      isProcessing = false;
    }

    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      onScanSuccess
    ).catch(err => {
      console.error("カメラ起動失敗:", err);
      alert("カメラの起動に失敗しました。カメラの権限を確認してください。");
    });
  </script>
</body>
</html>
