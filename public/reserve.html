<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINK 予約ページ</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; background: #f9f9f9; color: #333; }
    h2 { text-align: center; margin-bottom: 25px; }
    #user-status { font-size: 0.9rem; color: #666; margin-bottom: 20px; text-align: center; }
    
    /* カードのデザイン */
    .card { 
      background: white; 
      padding: 20px; 
      margin-bottom: 15px; 
      border-radius: 12px; 
      border: 2px solid #eee; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
      cursor: pointer; 
      transition: all 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card:hover:not(.full) { border-color: #06C755; transform: translateY(-2px); }
    .card.full { opacity: 0.4; background: #f1f1f1; cursor: not-allowed; border-color: #ddd; }
    
    .slot-info .time { font-size: 1.4rem; font-weight: bold; margin-bottom: 5px; }
    .slot-info .count { font-size: 0.9rem; color: #666; }
    
    .status-badge { font-size: 1.8rem; font-weight: bold; }
    .status-circle { color: #28a745; }
    .status-triangle { color: #ffc107; }
    .status-cross { color: #dc3545; }

    /* ステップ画面共通スタイル */
    .step-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      display: none;
    }
    .step-box h3 { margin-top: 0; color: #06C755; }
    .step-box p { font-size: 1.1rem; margin: 15px 0; color: #555; white-space: pre-line; }
    
    select {
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-bottom: 25px;
      background: #fff;
    }

    .step-btns { display: flex; gap: 10px; justify-content: center; }
    .step-btns button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn-back { background: #e0e0e0; color: #333; }
    .btn-next, .btn-confirm { background: #06C755; color: white; }

    .hamburger { position: absolute; top: 15px; right: 20px; font-size: 24px; text-decoration: none; color: #333; }
  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <a href="/admin/login" class="hamburger">☰</a>
  <h2>『LINK』体験予約</h2>
  <div id="user-status">LINE連携確認中...</div>

  <!-- ① 枠一覧画面 -->
  <div id="slots-view">
    <div id="slots-container">読み込み中...</div>
  </div>

  <!-- ② 人数選択画面 -->
  <div id="step-count-view" class="step-box">
    <h3>人数選択</h3>
    <p id="selected-slot-time-text"></p>
    <label for="p-count">ご予約人数を選んでください</label>
    <select id="p-count"></select>
    <div class="step-btns">
      <button class="btn-back" onclick="backToSlots()">戻る</button>
      <button class="btn-next" onclick="goToConfirm()">確認画面へ</button>
    </div>
  </div>

  <!-- ③ 予約確認画面 -->
  <div id="step-confirm-view" class="step-box">
    <h3>予約確認</h3>
    <p id="confirm-text"></p>
    <div class="step-btns">
      <button class="btn-back" onclick="backToCount()">戻る</button>
      <button class="btn-confirm" onclick="confirmReservation()">予約を確定する</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let lineUserId = null;
    let lineDisplayName = "ゲスト";
    let slotsData = [];
    let selectedSlot = null;
    let selectedCount = 1;

    async function initLiff() {
      try {
        await liff.init({ liffId: "2012246919-cYjIOJwZ" });
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          const profile = await liff.getProfile();
          lineUserId = profile.userId;
          lineDisplayName = profile.displayName;
          document.getElementById('user-status').innerText = `ログイン中: ${profile.displayName} さん`;
        }
      } catch (e) {
        document.getElementById('user-status').innerText = '※ ブラウザからテスト閲覧中';
      }
    }
    initLiff();

    const socket = io();

    function loadSlots() {
      fetch('/api/data')
        .then(res => res.json())
        .then(data => {
          slotsData = data.slots;
          renderSlots(slotsData);
        });
    }

    loadSlots();
    socket.on('slots-updated', (data) => {
      slotsData = data.slots;
      renderSlots(slotsData);
    });

    function renderSlots(slots) {
      const container = document.getElementById('slots-container');
      if (!slots || slots.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#666;">現在予約できる枠はありません。</p>';
        return;
      }
      container.innerHTML = '';
      slots.forEach(slot => {
        const remaining = slot.capacity - slot.booked;
        const isFull = remaining <= 0;

        let symbol, colorClass, countText;
        if (isFull) {
          symbol = '✕';
          colorClass = 'status-cross';
          countText = 'キャンセル待ち';
        } else if (remaining <= 3) {
          symbol = '△';
          colorClass = 'status-triangle';
          countText = `残り枠数: ${remaining} / ${slot.capacity}`;
        } else {
          symbol = '〇';
          colorClass = 'status-circle';
          countText = `残り枠数: ${remaining} / ${slot.capacity}`;
        }

        container.innerHTML += `
          <div class="card ${isFull ? 'full' : ''}" ${isFull ? '' : `onclick="selectSlot(${slot.id})"`}>
            <div class="slot-info">
              <div class="time">${slot.time}</div>
              <div class="count">${countText}</div>
            </div>
            <div class="status-badge ${colorClass}">${symbol}</div>
          </div>
        `;
      });
    }

    function selectSlot(slotId) {
      selectedSlot = slotsData.find(s => s.id === slotId);
      if (!selectedSlot) return;

      const remaining = selectedSlot.capacity - selectedSlot.booked;
      document.getElementById('selected-slot-time-text').innerText = `${selectedSlot.time}\n（残り枠数: ${remaining}）`;
      
      // 人数選択のドロップダウンを動的に生成
      const selectElem = document.getElementById('p-count');
      selectElem.innerHTML = '';
      for (let i = 1; i <= remaining; i++) {
        selectElem.innerHTML += `<option value="${i}">${i} 名</option>`;
      }

      // 画面切り替え
      document.getElementById('slots-view').style.display = 'none';
      document.getElementById('step-count-view').style.display = 'block';
    }

    function backToSlots() {
      document.getElementById('step-count-view').style.display = 'none';
      document.getElementById('slots-view').style.display = 'block';
    }

    function goToConfirm() {
      const selectElem = document.getElementById('p-count');
      selectedCount = parseInt(selectElem.value);

      document.getElementById('confirm-text').innerText = 
        `【予約時間】\n${selectedSlot.time}\n\n【予約人数】\n${selectedCount} 名\n\nこちらの内容で予約を確定しますか？`;

      document.getElementById('step-count-view').style.display = 'none';
      document.getElementById('step-confirm-view').style.display = 'block';
    }

    function backToCount() {
      document.getElementById('step-confirm-view').style.display = 'none';
      document.getElementById('step-count-view').style.display = 'block';
    }

    async function confirmReservation() {
      // 複数名分の予約を連打・ループで登録
      try {
        for (let i = 0; i < selectedCount; i++) {
          const res = await fetch('/api/reserve', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              slotId: selectedSlot.id, 
              userId: lineUserId, 
              displayName: selectedCount > 1 ? `${lineDisplayName} (他${selectedCount-1}名)` : lineDisplayName 
            })
          });
          const data = await res.json();
          if (!data.success) {
            alert(data.error || '予約途中でエラーが発生しました');
            location.reload();
            return;
          }
        }
        alert('予約が完了しました！');
        document.getElementById('step-confirm-view').style.display = 'none';
        document.getElementById('slots-view').style.display = 'block';
        loadSlots();
      } catch (e) {
        alert('通信エラーが発生しました。');
      }
    }
  </script>
</body>
</html>
