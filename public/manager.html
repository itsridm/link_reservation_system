<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>『LINK』体験予約 - 運営者画面</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h1 { font-size: 20px; color: #333; text-align: center; margin-bottom: 20px; }
    
    /* 枠リスト */
    .slot-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 10px; background: #fff; }
    .slot-time { font-size: 16px; font-weight: bold; color: #333; }
    .slot-capacity { font-size: 14px; color: #555; }
    
    .symbol-info { font-size: 15px; font-weight: bold; }
    .symbol-circle { color: #06c755; }
    .symbol-triangle { color: #ff9800; }
    .symbol-cross { color: #f44336; }
  </style>
</head>
<body>
  <div class="container">
    <h1>『LINK』体験 運営者画面</h1>
    
    <div class="card">
      <div style="font-weight: bold; margin-bottom: 12px; color: #555;">予約状況一覧</div>
      <div id="managerSlotList">読み込み中...</div>
    </div>
  </div>

  <script>
    const socket = io();

    socket.on('slots-updated', (data) => {
      updateManager(data.slots);
    });

    fetch('/api/data')
      .then(res => res.json())
      .then(data => {
        updateManager(data.slots);
      });

    function updateManager(slots) {
      const slotList = document.getElementById('managerSlotList');
      slotList.innerHTML = '';

      if (slots.length === 0) {
        slotList.innerHTML = '<div style="color: #777; text-align: center; padding: 20px 0;">現在登録されている枠はありません</div>';
        return;
      }

      slots.forEach(slot => {
        const remaining = slot.capacity - slot.booked;
        const div = document.createElement('div');
        div.className = 'slot-item';

        let symbolHtml = '';
        if (remaining >= 2) {
          symbolHtml = `<span class="symbol-info symbol-circle">〇</span>`;
        } else if (remaining === 1) {
          symbolHtml = `<span class="symbol-info symbol-triangle">△</span>`;
        } else {
          symbolHtml = `<span class="symbol-info symbol-cross" style="font-size: 13px;">キャンセル待ち</span>`;
        }

        div.innerHTML = `
          <span class="slot-time">${slot.time}</span>
          <span class="slot-capacity">残り枠数: ${remaining}/${slot.capacity}</span>
          ${symbolHtml}
        `;

        slotList.appendChild(div);
      });
    }
  </script>
</body>
</html>
