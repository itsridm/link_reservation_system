<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>『LINK』体験予約 - リアルタイム空き状況</title>
  <style>
    body {
      font-family: sans-serif;
      background: #ffffff; /* 背景を白に設定 */
      color: #333333;
      text-align: center;
      padding: 30px 20px;
      margin: 0;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 30px;
      color: #06C755;
    }
    .container {
      max-width: 600px;
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    /* 行（スロット）のデザイン */
    .slot-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f9f9f9;
      border: 2px solid #eee;
      border-radius: 10px;
      padding: 18px 25px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      transition: all 0.2s;
    }
    /* 満員のときのスタイル（薄くする） */
    .slot-row.full {
      opacity: 0.4;
      background: #f1f1f1;
      border-color: #ddd;
    }
    .slot-time {
      font-size: 1.5rem;
      font-weight: bold;
    }
    .slot-count {
      font-size: 1.1rem;
      color: #666;
    }
    .status-badge {
      font-size: 1.8rem;
      font-weight: bold;
    }
    .status-circle { color: #28a745; } /* 〇: 緑 */
    .status-triangle { color: #ffc107; } /* △: 黄色 */
    .status-cross { color: #dc3545; } /* ✕: 赤 */
  </style>
</head>
<body>
  <h1>『LINK』体験ご案内状況</h1>
  <div id="slots-container" class="container">
    <p>読み込み中...</p>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // 初回データ取得
    fetch('/api/data')
      .then(res => res.json())
      .then(data => renderSlots(data.slots));

    // リアルタイム更新
    socket.on('slots-updated', (data) => {
      renderSlots(data.slots);
    });

    function renderSlots(slots) {
      const container = document.getElementById('slots-container');
      if (!slots || slots.length === 0) {
        container.innerHTML = '<p style="font-size: 1.2rem; color: #666;">現在、ご案内可能な時間枠はありません。</p>';
        return;
      }
      container.innerHTML = '';
      slots.forEach(slot => {
        const remaining = slot.capacity - slot.booked;
        const isFull = remaining <= 0;

        let symbol, colorClass, countText;
        if (isFull) {
          symbol = '✕';
          colorClass = 'status-cross';
          countText = 'キャンセル待ち';
        } else if (remaining <= 3) {
          symbol = '△';
          colorClass = 'status-triangle';
          countText = `残り枠数: ${remaining}/${slot.capacity}`;
        } else {
          symbol = '〇';
          colorClass = 'status-circle';
          countText = `残り枠数: ${remaining}/${slot.capacity}`;
        }

        container.innerHTML += `
          <div class="slot-row ${isFull ? 'full' : ''}">
            <div class="slot-time">${slot.time}</div>
            <div class="slot-count">${countText}</div>
            <div class="status-badge ${colorClass}">${symbol}</div>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
