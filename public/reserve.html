<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINK 予約ページ</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; background: #f9f9f9; color: #333; }
    h2 { text-align: center; margin-bottom: 25px; }
    #user-status { font-size: 0.9rem; color: #666; margin-bottom: 20px; text-align: center; }
    
    /* カードのデザイン */
    .card { 
      background: white; 
      padding: 20px; 
      margin-bottom: 15px; 
      border-radius: 12px; 
      border: 2px solid #eee; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
      cursor: pointer; 
      transition: all 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card:hover:not(.full) { border-color: #06C755; transform: translateY(-2px); }
    
    /* 満員・残りわずかのスタイル */
    .card.full { opacity: 0.4; background: #f1f1f1; cursor: not-allowed; border-color: #ddd; }
    
    .slot-info .time { font-size: 1.4rem; font-weight: bold; margin-bottom: 5px; }
    .slot-info .count { font-size: 0.9rem; color: #666; }
    
    .status-badge { font-size: 1.8rem; font-weight: bold; }
    .status-circle { color: #28a745; } /* 〇: 緑 */
    .status-triangle { color: #ffc107; } /* △: 黄色 */
    .status-cross { color: #dc3545; } /* ✕: 赤 */

    /* モーダル（ポップアップ）のデザイン */
    #modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 80%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .modal-content h3 { margin-top: 0; font-size: 1.3rem; }
    .modal-content p { font-size: 1.1rem; margin: 15px 0 25px; color: #555; }
    .modal-btns { display: flex; gap: 10px; justify-content: center; }
    .modal-btns button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn-back { background: #e0e0e0; color: #333; }
    .btn-confirm { background: #06C755; color: white; }

    .hamburger { position: absolute; top: 15px; right: 20px; font-size: 24px; text-decoration: none; color: #333; }
  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <a href="/admin/login" class="hamburger">☰</a>
  <h2>『LINK』体験予約</h2>
  <div id="user-status">LINE連携確認中...</div>

  <div id="slots-container">読み込み中...</div>

  <!-- 確認ポップアップ（モーダル） -->
  <div id="modal">
    <div class="modal-content">
      <h3>予約確認</h3>
      <p id="modal-text">時間を読み込み中...</p>
      <div class="modal-btns">
        <button class="btn-back" onclick="closeModal()">戻る</button>
        <button class="btn-confirm" onclick="confirmReservation()">予約する</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let lineUserId = null;
    let lineDisplayName = "ゲスト";
    let selectedSlotId = null;

    async function initLiff() {
      try {
        await liff.init({ liffId: "YOUR_LIFF_ID" });
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          const profile = await liff.getProfile();
          lineUserId = profile.userId;
          lineDisplayName = profile.displayName;
          document.getElementById('user-status').innerText = `ログイン中: ${profile.displayName} さん`;
        }
      } catch (e) {
        document.getElementById('user-status').innerText = '※ ブラウザからテスト閲覧中';
      }
    }
    initLiff();

    const socket = io();
    socket.on('slots-updated', (data) => renderSlots(data.slots));
    fetch('/api/data').then(res => res.json()).then(data => renderSlots(data.slots));

    function renderSlots(slots) {
      const container = document.getElementById('slots-container');
      if (!slots || slots.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#666;">現在予約できる枠はありません。</p>';
        return;
      }
      container.innerHTML = '';
      slots.forEach(slot => {
        const remaining = slot.capacity - slot.booked;
        const isFull = remaining <= 0;

        // 条件に応じた記号と色の判定
        let symbol, colorClass;
        if (isFull) {
          symbol = '✕';
          colorClass = 'status-cross';
        } else if (remaining <= 3) {
          symbol = '△';
          colorClass = 'status-triangle'; // 黄色
        } else {
          symbol = '〇';
          colorClass = 'status-circle';   // 緑
        }

        container.innerHTML += `
          <div class="card ${isFull ? 'full' : ''}" ${isFull ? '' : `onclick="openModal(${slot.id}, '${slot.time}')"`}>
            <div class="slot-info">
              <div class="time">${slot.time}</div>
              <div class="count">残り枠数: ${remaining} / ${slot.capacity}</div>
            </div>
            <div class="status-badge ${colorClass}">${symbol}</div>
          </div>
        `;
      });
    }

    function openModal(slotId, slotTime) {
      selectedSlotId = slotId;
      document.getElementById('modal-text.innerText = `${slotTime}\nこちらの時間帯で予約しますか？`;` // Correct format below
      document.getElementById('modal-text').innerText = `${slotTime}\nこちらの時間帯で予約しますか？`;
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      selectedSlotId = null;
      document.getElementById('modal').style.display = 'none';
    }

    async function confirmReservation() {
      if (!selectedSlotId) return;
      const res = await fetch('/api/reserve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slotId: selectedSlotId, userId: lineUserId, displayName: lineDisplayName })
      });
      const data = await res.json();
      closeModal();
      if (data.success) {
        alert('予約が完了しました！');
      } else {
        alert(data.error);
      }
    }
  </script>
</body>
</html>
