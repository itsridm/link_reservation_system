<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>『LINK』体験予約</title>
  <script src="/socket.io/socket.io.js"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; background: #f4f6f8; margin: 0; padding: 15px; }
    .container { max-width: 500px; margin: 0 auto; }
    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .step-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #333; border-bottom: 2px solid #06c755; padding-bottom: 5px; }
    .user-status { font-size: 13px; color: #06c755; font-weight: bold; margin-bottom: 15px; }
    
    /* 枠アイテム */
    .slot-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 10px; cursor: pointer; background: #fff; transition: background 0.2s; }
    .slot-item:hover { background: #f9f9f9; }
    .slot-item.disabled { opacity: 0.5; background: #f0f0f0; cursor: not-allowed; }
    .slot-time { font-size: 15px; font-weight: bold; color: #333; }
    .slot-capacity { font-size: 14px; color: #555; }
    
    .symbol-info { font-size: 15px; font-weight: bold; }
    .symbol-circle { color: #06c755; }
    .symbol-triangle { color: #ff9800; }
    .symbol-cross { color: #f44336; font-size: 18px; }

    /* 入力・ボタン類 */
    select, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
    button { background: #06c755; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .btn-secondary { background: #757575; margin-top: 8px; }
    
    .summary-box { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 15px; margin-bottom: 15px; line-height: 1.8; }
    .result { margin-top: 15px; padding: 15px; border-radius: 8px; background: #eef9f2; color: #155724; font-size: 15px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div id="userStatus" class="user-status">LINE連携確認中...</div>

      <!-- ステップ1: 予約枠選択 -->
      <div id="step1">
        <div class="step-title">1. 予約枠を選択</div>
        <div id="slotList">読み込み中...</div>
      </div>

      <!-- ステップ2: 人数選択 -->
      <div id="step2" style="display: none;">
        <div class="step-title">2. 予約人数を選択</div>
        <div id="selectedSlotInfo" style="font-weight: bold; margin-bottom: 10px; color: #555;"></div>
        <label for="countSelect">人数:</label>
        <select id="countSelect">
          <option value="">人数を選択してください</option>
        </select>
        <button id="toStep3Btn" disabled>予約確認へ進む</button>
        <button id="backToStep1Btn" class="btn-secondary">戻る</button>
      </div>

      <!-- ステップ3: 予約確認 -->
      <div id="step3" style="display: none;">
        <div class="step-title">3. 予約内容の確認</div>
        <div class="summary-box">
          <div><strong>予約時間:</strong> <span id="summaryTime"></span></div>
          <div><strong>予約人数:</strong> <span id="summaryCount"></span>名</div>
        </div>
        <button id="confirmBtn">予約を確定する</button>
        <button id="backToStep2Btn" class="btn-secondary">戻る</button>
      </div>

      <!-- 予約完了表示 -->
      <div id="resultBox" class="result" style="display: none;"></div>
    </div>
  </div>

  <script>
    const socket = io();
    let currentUserId = "";
    let currentDisplayName = "";
    let globalSlots = [];
    let selectedSlot = null;
    let selectedCount = 1;

    async function initLIFF() {
      const userStatusDiv = document.getElementById('userStatus');
      try {
        await liff.init({ liffId: "2012246919-cYjIOJwZ" }); // お手元のLIFF ID
        
        // LINEアプリ内から開かれているかチェック
        if (liff.isInClient()) {
          if (!liff.isLoggedIn()) {
            liff.login(); // ログインしていなければLINEログイン画面へ
          } else {
            const profile = await liff.getProfile();
            currentUserId = profile.userId;
            currentDisplayName = profile.displayName;
            userStatusDiv.innerText = `ログイン中: ${currentDisplayName}さん`;
          }
        } else {
          // 外部ブラウザ（PCのChromeやSafariなど）で開いている場合
          userStatusDiv.innerText = "※ブラウザから閲覧中（LINE通知は届きません）";
        }
      } catch (err) {
        console.error("LIFF初期化エラー:", err);
        userStatusDiv.innerText = "※LINE連携エラー（ブラウザ閲覧扱い）";
      }
    }

    socket.on('slots-updated', (data) => {
      globalSlots = data.slots;
      renderSlots();
    });

    fetch('/api/data')
      .then(res => res.json())
      .then(data => {
        globalSlots = data.slots;
        renderSlots();
      });

    function renderSlots() {
      const slotList = document.getElementById('slotList');
      slotList.innerHTML = '';

      if (globalSlots.length === 0) {
        slotList.innerHTML = '<div style="color: #777; text-align: center; padding: 20px 0;">現在受付中の枠はありません</div>';
        return;
      }

      globalSlots.forEach(slot => {
        const remaining = slot.capacity - slot.booked;
        const div = document.createElement('div');
        div.className = 'slot-item';

        let capacityText = `残り枠数: ${remaining}/${slot.capacity}`;
        let symbolHtml = '';

        if (remaining >= 2) {
          symbolHtml = `<span class="symbol-info symbol-circle">〇</span>`;
        } else if (remaining === 1) {
          symbolHtml = `<span class="symbol-info symbol-triangle">△</span>`;
        } else {
          capacityText = `キャンセル待ち`;
          symbolHtml = `<span class="symbol-info symbol-cross">✕</span>`;
          div.classList.add('disabled');
        }

        div.innerHTML = `
          <span class="slot-time">${slot.time}</span>
          <span class="slot-capacity">${capacityText}</span>
          ${symbolHtml}
        `;

        if (remaining > 0) {
          div.addEventListener('click', () => {
            selectedSlot = slot;
            goToStep2(remaining);
          });
        }

        slotList.appendChild(div);
      });
    }

    function goToStep2(maxAvailable) {
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
      document.getElementById('selectedSlotInfo').innerText = `選択枠: ${selectedSlot.time}`;

      const countSelect = document.getElementById('countSelect');
      const toStep3Btn = document.getElementById('toStep3Btn');
      
      countSelect.innerHTML = '<option value="">人数を選択してください</option>';
      
      const limit = Math.min(maxAvailable, 4);
      for (let i = 1; i <= limit; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${i}名`;
        countSelect.appendChild(opt);
      }

      toStep3Btn.disabled = true;

      countSelect.onchange = () => {
        if (countSelect.value) {
          selectedCount = parseInt(countSelect.value);
          toStep3Btn.disabled = false;
        } else {
          toStep3Btn.disabled = true;
        }
      };
    }

    document.getElementById('toStep3Btn').onclick = () => {
      document.getElementById('step2').style.display = 'none';
      document.getElementById('step3').style.display = 'block';
      document.getElementById('summaryTime').innerText = selectedSlot.time;
      document.getElementById('summaryCount').innerText = selectedCount;
    };

    document.getElementById('backToStep1Btn').onclick = () => {
      document.getElementById('step2').style.display = 'none';
      document.getElementById('step1').style.display = 'block';
      selectedSlot = null;
    };

    document.getElementById('backToStep2Btn').onclick = () => {
      document.getElementById('step3').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
    };

    document.getElementById('confirmBtn').onclick = async () => {
      const confirmBtn = document.getElementById('confirmBtn');
      confirmBtn.disabled = true;
      confirmBtn.innerText = "送信中...";

      try {
        const res = await fetch('/api/reserve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            slotId: selectedSlot.id,
            userId: currentUserId,
            displayName: currentDisplayName,
            count: selectedCount
          })
        });

        const data = await res.json();
        if (data.success) {
          document.getElementById('step3').style.display = 'none';
          const resultBox = document.getElementById('resultBox');
          resultBox.style.display = 'block';
          resultBox.innerHTML = `
            <strong>予約が完了しました！</strong><br><br>
            ■ 予約ID: <strong>${data.reservation.id}</strong><br>
            ■ 予約時間: ${selectedSlot.time}<br>
            ■ 予約人数: ${selectedCount}名<br><br>
            LINEのトーク画面に確認メッセージとQRコードをお送りしました。
          `;
        } else {
          alert("予約エラー: " + data.error);
          confirmBtn.disabled = false;
          confirmBtn.innerText = "予約を確定する";
        }
      } catch (err) {
        alert("通信エラーが発生しました");
        confirmBtn.disabled = false;
        confirmBtn.innerText = "予約を確定する";
      }
    };
  </script>
</body>
</html>
