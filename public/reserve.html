<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>『LINK』体験予約</title>
  <script src="/socket.io/socket.io.js"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; background: #f4f6f8; margin: 0; padding: 15px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; }
    h2 { margin-top: 0; color: #333; }
    .user-info { font-weight: bold; color: #06c755; margin-bottom: 15px; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    select, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
    button { background: #06c755; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 20px; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .result { margin-top: 20px; padding: 15px; border-radius: 8px; background: #eef9f2; color: #155724; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>『LINK』体験予約</h2>
    <div id="userStatus" class="user-info">LINE連携確認中...</div>

    <form id="reserveForm">
      <label for="slotSelect">予約枠を選択</label>
      <select id="slotSelect" required>
        <option value="">枠を選択してください</option>
      </select>

      <button type="submit" id="submitBtn">予約を確定する</button>
    </form>

    <div id="resultBox" class="result"></div>
  </div>

  <script>
    const socket = io();
    let currentUserId = "";
    let currentDisplayName = "";

    // 1. LIFF初期化 & ユーザー情報取得
    async function initLIFF() {
      const userStatusDiv = document.getElementById('userStatus');
      try {
        // ※ご自身の実際のLIFF ID（例: "2012246919-xxxxxxx"）に書き換えてください
        await liff.init({ liffId: "2012246919-cYjIOJwZ" });

        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          currentUserId = profile.userId;
          currentDisplayName = profile.displayName;
          userStatusDiv.innerText = `ログイン中: ${currentDisplayName}さん`;
        } else {
          // LIFF環境外（ブラウザ直接アクセス等）の場合
          userStatusDiv.innerText = "※ブラウザから閲覧中（LINE通知は届きません）";
          // 必要であれば自動ログインを促す場合は liff.login(); を呼ぶ
        }
      } catch (err) {
        console.error("LIFF初期化エラー:", err);
        userStatusDiv.innerText = "※LINE情報の取得に失敗しました";
      }
    }

    initLIFF();

    // 2. 枠データの受信 & 描画
    let globalSlots = [];
    socket.on('slots-updated', (data) => {
      globalSlots = data.slots;
      renderSlots();
    });

    fetch('/api/data')
      .then(res => res.json())
      .then(data => {
        globalSlots = data.slots;
        renderSlots();
      });

    function renderSlots() {
      const select = document.getElementById('slotSelect');
      const currentVal = select.value;
      select.innerHTML = '<option value="">枠を選択してください</option>';

      globalSlots.forEach(slot => {
        const remaining = slot.capacity - slot.booked;
        const option = document.createElement('option');
        option.value = slot.id;
        
        if (remaining <= 0) {
          option.textContent = `${slot.time} (満員 - キャンセル待ち)`;
          option.disabled = true;
        } else {
          option.textContent = `${slot.time} (残り ${remaining} 名)`;
        }
        select.appendChild(option);
      });

      if (currentVal) select.value = currentVal;
    }

    // 3. 予約リクエスト送信
    document.getElementById('reserveForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const slotId = document.getElementById('slotSelect').value;
      const submitBtn = document.getElementById('submitBtn');
      const resultBox = document.getElementById('resultBox');

      if (!slotId) return alert("枠を選択してください");

      submitBtn.disabled = true;
      submitBtn.innerText = "処理中...";

      try {
        const res = await fetch('/api/reserve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            slotId: slotId,
            userId: currentUserId,           // ★ここがサーバーへ送られます！
            displayName: currentDisplayName
          })
        });

        const data = await res.json();
        if (data.success) {
          resultBox.style.display = 'block';
          resultBox.innerHTML = `<strong>予約が完了しました！</strong><br>予約ID: ${data.reservation.id}<br>LINEトーク画面をご確認ください。`;
          document.getElementById('reserveForm').reset();
        } else {
          alert("予約エラー: " + data.error);
        }
      } catch (err) {
        alert("通信エラーが発生しました");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "予約を確定する";
      }
    });
  </script>
</body>
</html>
